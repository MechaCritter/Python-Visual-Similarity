---
upgrade:
  - |
    Notebooks are committed without outputs. Run ``make strip-notebooks``
    before committing one, since the CI rejects notebooks that still carry
    outputs or execution metadata.
enhancements:
  - |
    The tutorial notebooks moved from the separate examples repository into
    ``docs/tutorials/notebooks/``, together with their plotting helpers.
  - |
    The Siamese, Triplet and VLAD/Fisher Vector tutorials train on a subset of
    Oxford Flowers, so that they also finish on a CPU.
  - |
    The documentation renders every tutorial notebook as a page with its
    executed outputs.
  - |
    The ``Docs`` workflow also builds pull requests, executes the tutorial
    notebooks they change and uploads the rendered HTML as the ``docs-html``
    artifact.
  - |
    The new ``Tutorials`` workflow executes every tutorial notebook from
    scratch every three days and on demand.
  - |
    The clustering helper of the tutorials reports normalized mutual
    information under nmi instead of adjusted mutual information.
  - |
    The image search tutorial builds its FAISS index from the embeddings of
    the store instead of embedding the gallery a second time.
  - |
    The pipeline tutorial trains on every twelfth training image, which covers
    all 102 classes instead of the three the first 500 images belong to.
  - |
    GitHub alert blocks such as > [!NOTE] in the tutorial notebooks render
    as admonitions in the documentation.
