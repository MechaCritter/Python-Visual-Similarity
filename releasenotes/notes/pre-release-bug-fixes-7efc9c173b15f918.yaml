---
upgrade:
  - |
    Importing ``pyvisim`` no longer configures logging, and its loggers are
    named after their modules (e.g. ``pyvisim.datasets.datasets``) instead of
    ``Data_Set``, ``Feature_Extractor``, ``Pipeline`` and
    ``Similarity_Metrics``. Configure the ``pyvisim`` logger to see the
    library's messages.
  - |
    ``from pyvisim import *`` no longer imports ``datasets``, which needs the
    ``nn`` extra. Access it as ``pyvisim.datasets`` or import it explicitly.
  - |
    ``VLADEmbedder`` and ``FisherVectorEmbedder`` default to
    ``raise_error_when_pca_incompatible=True``, so a clustering model the
    fitted PCA cannot feed raises a ``RuntimeError`` instead of silently
    dropping the PCA. Pass ``False`` to keep the old behavior.
fixes:
  - |
    Importing ``pyvisim`` no longer creates a ``res/logs`` folder next to the
    installed package, which failed on read-only installs.
  - |
    ``from pyvisim import *`` works without the ``nn`` extra, and submodules
    such as ``pyvisim.classic`` are reachable after a plain ``import pyvisim``.
  - |
    The warning emitted when a clustering model resets an incompatible PCA is
    a ``FutureWarning`` and names ``raise_error_when_pca_incompatible=True``
    as the way to raise instead.
  - |
    ``SIFT`` and ``RootSIFT`` keep their constructor arguments when an
    embedder using them is saved and loaded, instead of coming back with the
    default arguments.
