---
fixes:
  - |
    ``VLADEmbedder`` and ``FisherVectorEmbedder`` now raise ``RuntimeError``
    for a fitted PCA whose dimensions do not match the feature extractor or
    the clustering model, like their other dimension checks.
  - |
    ``learn(dim_reduction_factor=...)`` now emits a ``FutureWarning`` when it
    replaces a PCA the embedder already has.
