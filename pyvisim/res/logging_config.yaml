# logging_config.yaml
#
# Parsed by pyvisim._config.load_yaml, which understands only a subset of YAML:
# nested mappings, inline flow sequences ([a, b]), comments and plain scalars.
# Block sequences, anchors and multi-line strings are not supported.
version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    level: DEBUG
    stream: ext://sys.stdout

  file_handler:
    class: logging.handlers.RotatingFileHandler
    formatter: simple
    level: DEBUG
    filename: "%(LOG_FILE_PATH)s"
    maxBytes: 256000 # 256KB
    backupCount: 3

loggers:
  Data_Set:
    level: WARNING
    handlers: [console, file_handler]
    propagate: no

  Feature_Extractor:
    level: WARNING
    handlers: [console, file_handler]
    propagate: no

  Pipeline:
    level: WARNING
    handlers: [console, file_handler]
    propagate: no

  Similarity_Metrics:
    level: WARNING
    handlers: [console, file_handler]
    propagate: no

root:
  level: WARNING
  handlers: [console]
