[build-system]
requires = ["setuptools>=77.0.0", "wheel", "Cython>=3.0.0", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvisim"
version = "0.8.2"
description = "A Python library for image similarity analysis using Image Encoders and Neural Networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nhat Huy Vu", email = "vunhathuy234@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "Pillow",
    "platformdirs",
    "safetensors",
    "scipy",
    "tqdm",
    "requests",
]

# To install PyTorch with CUDA support instead of the CPU-only default:
#   uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
# Replace cu124 with the CUDA version matching your system (e.g. cu121, cu118).

# Optional extras. Install with e.g. 'pip install "pyvisim[nn]"'.
[project.optional-dependencies]
# Deep-learning features and models (DeepConvFeature, the datasets and
# neural_networks modules, including ClipEmbedder) built on top of
# torch / torchvision. huggingface_hub downloads the pretrained CLIP
# checkpoints from the Hugging Face Hub.
nn = [
    "torch",
    "torchvision",
    "huggingface_hub",
]
# Accelerated nearest-neighbour search and retrieval (ImageIndex,
# InMemoryImageEmbeddingStore, ImageRetriever) built on top of faiss.
search = [
    "faiss-cpu",
]

[project.urls]
Homepage = "https://github.com/MechaCritter/Python-Visual-Similarity"

[tool.setuptools.packages.find]
include = ["pyvisim", "pyvisim.*"]

[tool.setuptools.package-data]
pyvisim = [
    "res/model_files/*.encoder",
    "res/logging_config.yaml",
    "py.typed",
    "structural/_kernel/*.pyx",
    "structural/_kernel/*.pyi",
    "features/_vendored/sift/*.pyx",
    "features/_vendored/sift/*.pxd",
]

# Dependencies groups to isolate test env from production env
[dependency-groups]
types = [
  "mypy",
]
dead-code = [
  "vulture",
]
fmt = [
  "ruff",
]
test = [
    "pytest",
    "pytest-cov",
    "scipy",
    # Reference implementation for the clustering/PCA equivalence tests and
    # the from_sklearn conversion tests.
    "scikit-learn",
]
docs = [
    "sphinx",
    "myst-parser",
    "furo",
]
# Regenerating the checked-in C sources of the Cython kernels (make build-ext)
build = [
    "cython",
    "setuptools",
]
# Reference implementations and tooling for the notebooks/benchmark_*.ipynb
# notebooks and docs/structural/benchmarks/generate_benchmark.py; scikit-learn
# is the comparison baseline of the clustering/PCA benchmarks.
bench = [
    "scikit-image",
    "scikit-learn",
    "torchmetrics",
    "matplotlib",
    "nbclient",
    "ipykernel",
]

# Per-platform wheel builds for the compiled Cython extension, run by the
# publish workflow (.github/workflows/publish_pypi.yml) via cibuildwheel.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# Skip 32-bit and musl targets: scipy ships no wheels for them.
skip = ["*-musllinux_*", "*_i686", "*-win32"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^build/", "^dist/", "^\\.venv/", "^venv/"]

# Vendored third-party code is kept byte-comparable with upstream and is not
# held to this project's typing standards.
[[tool.mypy.overrides]]
module = "pyvisim.features._vendored.*"
ignore_errors = true
ignore_missing_imports = true

# Third-party libraries that ship without type stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = [
  "faiss.*",
  "scipy.*",
  "sklearn.*",
  "torchvision.*",
  "tqdm.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88
# _vendored folders hold third-party code kept byte-comparable with upstream.
# Markdown is prose: recent ruff versions reformat the Python code blocks inside
# it, which re-wraps the hand-laid-out documentation examples at 'line-length'.
extend-exclude = ["*.ipynb", "*.md", "_vendored"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line-too-long (handled by the formatter)
]

[tool.ruff.lint.isort]
# Pin the first-party classification instead of leaving it to ruff's filesystem
# heuristic, which resolves these names against the checkout layout and does not
# agree across environments: CI sorted 'import pyvisim.<submodule>' into the
# third-party block while local runs kept it first-party, so 'ruff check' failed
# only in CI. Naming them here makes the sections deterministic everywhere.
known-first-party = ["pyvisim", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.codespell]
ignore-words-list = "Commun"
skip = "./examples,./notebooks,*/_vendored/*"  # jupyter notebooks; vendored third-party code

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always emit a coverage report at the end of every run, locally and in CI.
addopts = "--cov=pyvisim --cov-report=term-missing"
markers = [
  "slow: tests that download model weights or data (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["pyvisim"]
branch = true

[tool.coverage.report]
show_missing = true
