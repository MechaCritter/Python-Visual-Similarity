# .github/workflows/publish_pypi.yml
#
# Publishes pyvisim to PyPI when a version tag is pushed.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"           # version tags only
  workflow_dispatch:   # allows triggering manually from the GitHub Actions UI
    inputs:
      test-pypi-only:
        description: "Publish to Test PyPI only (dry run)"
        type: boolean
        default: true

# Minimal default permissions: each job opts in to only what it needs.
permissions:
  contents: read

jobs:
  # Build the source distribution.
  build-sdist:
    name: "Build sdist"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: "Build sdist"
        # SOURCE_DATE_EPOCH makes builds reproducible (same source -> same bytes).
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) \
          uv build --sdist

      - name: "Upload sdist artifact"
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # Build one binary wheel per platform and CPython version (the package
  # ships a compiled Cython extension, see setup.py). Wheel selection is
  # configured under [tool.cibuildwheel] in pyproject.toml.
  build-wheels:
    name: "Build wheels (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: "Build wheels"
        run: uvx cibuildwheel --output-dir dist

      - name: "Upload wheel artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 5

  # Publish to PyPI (only on tag pushes).
  publish:
    name: "Publish to PyPI"
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest

    environment:
      name: publish                             # GitHub Environment
      url: https://pypi.org/project/pyvisim/

    permissions:
      id-token: write                            # Required for Trusted Publishing

    steps:
      - name: "Download dist artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          attestations: true                     # Cryptographically signs the release

  # Publish to Test PyPI (manual dry-run only).
  # Trigger via: Actions → "Publish to PyPI" → "Run workflow"
  # and leave "test-pypi-only" checked.
  publish-test:
    name: "Publish to Test PyPI (dry run)"
    if: github.event_name == 'workflow_dispatch'
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyvisim/

    permissions:
      id-token: write

    steps:
      - name: "Download dist artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: "Publish to Test PyPI"
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
