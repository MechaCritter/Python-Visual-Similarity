name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress production
# deployments finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 1. Build the Sphinx HTML documentation
    name: "Build documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # The 'nn' and 'search' extras are installed so that autodoc
      # documents the real classes instead of mocked placeholders.
      - name: Install dependencies
        run: uv sync --group docs --extra nn --extra search

      - name: Build HTML documentation
        run: uv run --group docs sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html

      # The 'Benchmarks' workflow publishes them to the orphan
      # 'benchmark-assets' branch, and they are overlaid here so the absolute
      # '_IMAGE_BASE_URL' links in the docs resolve..
      - name: Overlay benchmark barplots from the assets branch
        run: |
          set -euo pipefail
          dest="docs/sphinx/_build/html/benchmarks"
          if git ls-remote --exit-code --heads origin benchmark-assets >/dev/null 2>&1; then
            git fetch --depth=1 origin benchmark-assets
            mkdir -p "$dest"
            git archive FETCH_HEAD | tar -x -C "$dest"
            echo "Overlaid $(find "$dest" -type f | wc -l) benchmark image(s)."
          else
            echo "::notice::No benchmark-assets branch yet. Run the Benchmarks workflow once to generate it."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/sphinx/_build/html

  deploy:
    # 2. Deploy the built HTML to GitHub Pages
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
