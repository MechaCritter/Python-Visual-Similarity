name: Docs

on:
  push:
    branches:
      - main
  # Pull requests build the documentation without deploying it. The notebooks
  # they change are executed, and the HTML is uploaded for review.
  pull_request:
    branches:
      - main
  # A version tag moves its release notes from "Unreleased" under that version.
  # Only main may deploy to the 'github-pages' environment, so instead of
  # running on the tag, the site is rebuilt from main once the release
  # workflow has run.
  workflow_run:
    workflows: ["Project release on GitHub"]
    types:
      - completed
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

permissions:
  contents: read

# Allow only one concurrent deployment, but let in-progress production
# deployments finish. A new push to a pull request cancels the build of its
# previous push instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # 1. Build the Sphinx HTML documentation
    name: "Build documentation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 'actions/configure-pages' reads the Pages settings of the repository.
      pages: read
    env:
      # The same fixed path as in the CI workflow, so its weight cache applies.
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0   # the release notes pages are generated by reno from the git history

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # The 'nn' extra is installed so that autodoc documents the real
      # classes instead of mocked placeholders. The 'tutorials' group holds
      # what the tutorial notebooks import while the build executes them.
      - name: Install dependencies
        run: uv sync --group docs --group tutorials --extra nn

      # Binaries are kept out of the main history, so the sidebar logo lives
      # under 'docs/logo/' on the orphan 'assets' branch and is copied into the
      # static folder that furo resolves 'light_logo' and 'dark_logo' against.
      - name: Fetch the logo from the assets branch
        run: |
          set -euo pipefail
          dest="docs/_static"
          if ! git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            echo "::warning::No assets branch yet. The docs build without a logo."
            exit 0
          fi
          git fetch --depth=1 origin assets
          if ! git ls-tree --name-only FETCH_HEAD docs/logo | grep -q .; then
            echo "::warning::The assets branch carries no 'docs/logo' folder."
            exit 0
          fi
          # '--strip-components=2' drops the 'docs/logo/' prefix so the files
          # land directly in the static folder.
          git archive FETCH_HEAD docs/logo | tar -x --strip-components=2 -C "$dest"
          echo "Copied $(find "$dest" -name '*.png' | wc -l) logo file(s)."

      # jupyter-cache keys every executed notebook on its code cells, so the
      # newest cache is safe to restore and only changed notebooks run again.
      # It does not track tutorial_utils.py, so a change there starts from an
      # empty cache. Bump '-v1' to discard every cached execution.
      - name: Restore the executed notebooks
        id: notebook-cache
        uses: actions/cache/restore@v6
        with:
          path: docs/_build/.jupyter_cache
          key: pyvisim-notebooks-v1-${{ hashFiles('docs/tutorials/notebooks/tutorial_utils.py') }}
          restore-keys: pyvisim-notebooks-v1-${{ hashFiles('docs/tutorials/notebooks/tutorial_utils.py') }}-

      - name: Resolve the dataset cache directory
        id: dataset-cache
        run: |
          set -euo pipefail
          path="$(uv run --no-sync python .github/scripts/prefetch_assets.py --print-cache-dir)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # The notebooks download the Oxford Flowers dataset and pretrained
      # weights. Restore only, the 'Warm asset cache' workflow owns these caches.
      - name: Restore the Oxford Flowers dataset
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.dataset-cache.outputs.path }}
          key: pyvisim-dataset-${{ runner.os }}-v1

      - name: Restore the pretrained backbone weights
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TORCH_HOME }}
          key: pyvisim-torch-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: pyvisim-torch-${{ runner.os }}-

      - name: Build HTML documentation
        run: uv run --group docs --group tutorials sphinx-build -W -b html docs docs/_build/html

      # Also after a failed build, so that the next run only executes the
      # notebooks that did not finish. A changed notebook leaves its previous
      # execution behind, which is removed so that the cache does not grow.
      - name: Prune stale notebook executions
        if: ${{ !cancelled() && hashFiles('docs/_build/.jupyter_cache/executed/**') != '' }}
        run: uv run --no-sync python .github/scripts/prune_notebook_cache.py docs/_build/.jupyter_cache docs/tutorials/notebooks

      # The key hashes the cached executions, so a build that neither executed
      # nor pruned a notebook does not save the same cache again.
      - name: Save the executed notebooks
        if: ${{ !cancelled() && hashFiles('docs/_build/.jupyter_cache/executed/**') != '' && steps.notebook-cache.outputs.cache-matched-key != format('pyvisim-notebooks-v1-{0}-{1}', hashFiles('docs/tutorials/notebooks/tutorial_utils.py'), hashFiles('docs/_build/.jupyter_cache/executed/**')) }}
        uses: actions/cache/save@v6
        with:
          path: docs/_build/.jupyter_cache
          key: pyvisim-notebooks-v1-${{ hashFiles('docs/tutorials/notebooks/tutorial_utils.py') }}-${{ hashFiles('docs/_build/.jupyter_cache/executed/**') }}

      # The pull request opened from the 'Benchmarks' workflow publishes them
      # under 'benchmark/' on the orphan 'assets' branch, and they are overlaid
      # here so the absolute '_IMAGE_BASE_URL' links in the docs resolve.
      - name: Overlay benchmark barplots from the assets branch
        run: |
          set -euo pipefail
          dest="docs/_build/html/benchmarks"
          if git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            git fetch --depth=1 origin assets
            if ! git ls-tree --name-only FETCH_HEAD benchmark | grep -q .; then
              echo "::notice::The assets branch carries no 'benchmark/' folder yet."
              exit 0
            fi
            mkdir -p "$dest"
            # Only the 'benchmark/' folder belongs on Pages; the branch may
            # carry unrelated binaries. '--strip-components=1' drops that
            # prefix so the published URLs stay under '/benchmarks/'.
            git archive FETCH_HEAD benchmark | tar -x --strip-components=1 -C "$dest"
            echo "Overlaid $(find "$dest" -type f | wc -l) benchmark image(s)."
          else
            echo "::notice::No assets branch yet, so no benchmark barplots are overlaid."
          fi

      # The committed notebooks carry no outputs, so a reviewer only sees what
      # they produce in the rendered HTML.
      - name: Upload the HTML for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    # 2. Deploy the built HTML to GitHub Pages
    name: "Deploy to GitHub Pages"
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
