name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress production
# deployments finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 1. Build the Sphinx HTML documentation
    name: "Build documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # The 'nn' and 'search' extras are installed so that autodoc
      # documents the real classes instead of mocked placeholders.
      - name: Install dependencies
        run: uv sync --group docs --extra nn --extra search

      - name: Build HTML documentation
        run: uv run --group docs sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/sphinx/_build/html

  deploy:
    # 2. Deploy the built HTML to GitHub Pages
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
