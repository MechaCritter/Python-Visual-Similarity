name: Docs

on:
  push:
    branches:
      - main
  # A version tag moves its release notes from "Unreleased" under that version.
  # Only main may deploy to the 'github-pages' environment, so instead of
  # running on the tag, the site is rebuilt from main once the release
  # workflow has run.
  workflow_run:
    workflows: ["Project release on GitHub"]
    types:
      - completed
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress production
# deployments finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # 1. Build the Sphinx HTML documentation
    name: "Build documentation"
    runs-on: ubuntu-latest
    env:
      # The same fixed path as in the CI workflow, so its weight cache applies.
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0   # the release notes pages are generated by reno from the git history

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # The 'nn' extra is installed so that autodoc documents the real
      # classes instead of mocked placeholders. The 'tutorials' group holds
      # what the tutorial notebooks import while the build executes them.
      - name: Install dependencies
        run: uv sync --group docs --group tutorials --extra nn

      # Binaries are kept out of the main history, so the sidebar logo lives
      # under 'docs/logo/' on the orphan 'assets' branch and is copied into the
      # static folder that furo resolves 'light_logo' and 'dark_logo' against.
      - name: Fetch the logo from the assets branch
        run: |
          set -euo pipefail
          dest="docs/_static"
          if ! git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            echo "::warning::No assets branch yet. The docs build without a logo."
            exit 0
          fi
          git fetch --depth=1 origin assets
          if ! git ls-tree --name-only FETCH_HEAD docs/logo | grep -q .; then
            echo "::warning::The assets branch carries no 'docs/logo' folder."
            exit 0
          fi
          # '--strip-components=2' drops the 'docs/logo/' prefix so the files
          # land directly in the static folder.
          git archive FETCH_HEAD docs/logo | tar -x --strip-components=2 -C "$dest"
          echo "Copied $(find "$dest" -name '*.png' | wc -l) logo file(s)."

      - name: Resolve the dataset cache directory
        id: dataset-cache
        run: |
          set -euo pipefail
          path="$(uv run --no-sync python .github/scripts/prefetch_assets.py --print-cache-dir)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # The notebooks download the Oxford Flowers dataset and pretrained
      # weights. Restore only, the 'Warm asset cache' workflow owns these caches.
      - name: Restore the Oxford Flowers dataset
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.dataset-cache.outputs.path }}
          key: pyvisim-dataset-${{ runner.os }}-v1

      - name: Restore the pretrained backbone weights
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TORCH_HOME }}
          key: pyvisim-torch-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: pyvisim-torch-${{ runner.os }}-

      - name: Build HTML documentation
        run: uv run --group docs --group tutorials sphinx-build -W -b html docs docs/_build/html

      # The pull request opened from the 'Benchmarks' workflow publishes them
      # under 'benchmark/' on the orphan 'assets' branch, and they are overlaid
      # here so the absolute '_IMAGE_BASE_URL' links in the docs resolve.
      - name: Overlay benchmark barplots from the assets branch
        run: |
          set -euo pipefail
          dest="docs/_build/html/benchmarks"
          if git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            git fetch --depth=1 origin assets
            if ! git ls-tree --name-only FETCH_HEAD benchmark | grep -q .; then
              echo "::notice::The assets branch carries no 'benchmark/' folder yet."
              exit 0
            fi
            mkdir -p "$dest"
            # Only the 'benchmark/' folder belongs on Pages; the branch may
            # carry unrelated binaries. '--strip-components=1' drops that
            # prefix so the published URLs stay under '/benchmarks/'.
            git archive FETCH_HEAD benchmark | tar -x --strip-components=1 -C "$dest"
            echo "Overlaid $(find "$dest" -type f | wc -l) benchmark image(s)."
          else
            echo "::notice::No assets branch yet, so no benchmark barplots are overlaid."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    # 2. Deploy the built HTML to GitHub Pages
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
